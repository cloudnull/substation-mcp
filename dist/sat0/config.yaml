# config.yaml for running substation-mcp serve against the sat0 local cloud.
#
# Bind to 0.0.0.0 so the conformance smoke (run from the container/host) can
# reach it. In a real deployment, put a TLS reverse proxy (Caddy/nginx) in
# front and bind 127.0.0.1; set server__public_url to the FQDN.
server:
  host: 0.0.0.0
  port: 8080
  endpoint: /v1
  # public_url: https://mcp.sat0.cloudnull.dev   # uncomment once behind TLS
  metrics_token: "change-me"

clouds:
  file: /work/dist/sat0/clouds.yaml
  default: sat0

# Keep sessions alive long enough for the conformance handshake + manual tests.
session:
  idle_ttl: 600
  max_lifetime: 86400

# Read/write both (the token is admin). Set policy.read_only=true for 9 tools.
policy:
  read_only: false
  max_calls_per_minute: 600
