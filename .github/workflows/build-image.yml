# Build the substation-mcp container image (linux/amd64) and push it to GHCR.
#
# The Genestack cluster (3-node amd64, containerd) pulls images from ghcr.io,
# so this is the canonical image source for the Genestack deployment. The
# Swift toolchain image (swift:6.4-rhel-ubi10) and the UBI10-minimal runtime
# are both amd64 here because GitHub's ubuntu-latest runners are amd64, so
# `linux/amd64` is the native arch — no QEMU emulation is required.
#
# Auth: pushes to ghcr.io/<owner>/<repo> using the built-in GITHUB_TOKEN,
# which has packages:write when granted below. The package is scoped to this
# repository, so no extra PAT or registry secret is needed.
#
# Trigger: every push to main, plus manual runs (workflow_dispatch) for testing.

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # cloudnull/substation-mcp

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Read the coordinated version from the chart so the image carries a
      # stable, human-friendly tag (e.g. 0.1.0) in addition to `latest` and
      # `sha-<commit>`. The docs reference this tag, so it must exist.
      - name: Read chart version
        id: version
        run: |
          V=$(grep -E '^version:' deploy/genestack/helm/substation-mcp/Chart.yaml \
              | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Image will also be tagged ${V}"

      - name: Docker setup-buildx-action
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,enable={{is_default_branch}},value=latest

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          # The coordinated version tag (e.g. 0.1.0) is appended so the docs'
          # `image.tag: 0.1.0` resolves. metadata-action provides `latest`,
          # `<branch>`, and `sha-<commit>`.
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
