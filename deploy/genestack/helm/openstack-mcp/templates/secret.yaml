{{- if .Values.appCred.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstack-mcp.fullname" . }}-appcred
  namespace: {{ include "openstack-mcp.namespace" . }}
  labels:
    {{- include "openstack-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  id: {{ .Values.appCred.id | quote }}
  secret: {{ .Values.appCred.secret | quote }}
{{- end }}
