{{- if .Values.serviceUser.enabled }}
{{- $fullname := include "substation-mcp.fullname" . -}}
{{- $ns := include "substation-mcp.namespace" . -}}
# The provisioner Job: a Helm post-install/post-upgrade hook that creates the
# deployment's standing identity (service user + application credential in the
# OpenStack `service` domain) and the `mcp` catalog entry (public/internal/admin
# endpoints), then writes the app-cred to the `<fullname>-service-identity`
# Secret and marks `<fullname>-clouds` as provisioned (which rolls the
# Deployment, now that clouds.yaml can carry the app-cred).
#
# It is IDEMPOTENT: on re-run it reuses the existing user + app-cred (no
# duplicates) and preserves the secret already in the identity Secret (a reused
# app-cred's secret is not recoverable).
#
# The operator's admin credential (app-cred or user/password) is read from
# environment variables (injected from `serviceUser.auth` below) and is used
# ONLY to mint a short-lived admin token — it is never written to any Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-provision
  namespace: {{ $ns }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-provisioner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Reuse the chart's securityContext (numeric runAsUser: 10001) so
          # runAsNonRoot can be verified against the image's named user.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # ── Operator admin credential (input; used only to mint a token) ──
            {{- with .Values.serviceUser.auth.appCred.id }}
            - name: OS_APPLICATION_CREDENTIAL_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serviceUser.auth.appCred.secret }}
            - name: OS_APPLICATION_CREDENTIAL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serviceUser.auth.password.username }}
            - name: OS_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serviceUser.auth.password.password }}
            - name: OS_PASSWORD
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serviceUser.auth.password.domain }}
            - name: OS_USER_DOMAIN_NAME
              value: {{ . | quote }}
            {{- end }}
            # ── Clouds.yaml (read-only; tells the binary where Keystone is) ───
            - name: OS_CLIENT_CONFIG_FILE
              value: /etc/openstack/clouds.yaml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: clouds
              mountPath: /etc/openstack/clouds.yaml
              subPath: clouds.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              FULLNAME={{ $fullname }}
              CLOUD="{{ .Values.serviceUser.cloud }}"
              IDENTITY_SECRET="${FULLNAME}-service-identity"
              CLOUDS_SECRET="${FULLNAME}-clouds"

              # 0. Mint the admin bootstrap token once, shared by provision and
              #    register-catalog (both use OS_AUTH_TOKEN when present).
              #    For password auth we mint with curl: some Keystones reject the
              #    in-process AsyncHTTPClient password-mint POST with a spurious
              #    400 even though the body is byte-identical to a curl request
              #    that succeeds. Domain-scoped so the token carries domain-level
              #    privileges (an unscoped token 403s on identity operations).
              #    For app-cred auth, OS_AUTH_TOKEN stays unset and each command
              #    mints from the app-cred (the reliable in-process path).
              {{- if and .Values.serviceUser.auth.password.username .Values.serviceUser.auth.password.password }}
              if [ -z "${OS_AUTH_TOKEN:-}" ]; then
                ADOM="{{ .Values.serviceUser.auth.password.domain | default "default" }}"
                MINT_BODY=$(printf '{"auth":{"identity":{"methods":["password"],"password":{"user":{"name":"%s","domain":{"name":"%s"},"password":"%s"}}},"scope":{"domain":{"name":"%s"}}}}' \
                  "{{ .Values.serviceUser.auth.password.username }}" "$ADOM" \
                  "{{ .Values.serviceUser.auth.password.password }}" "$ADOM")
                AUTH_URL="{{ .Values.clouds.sat0.auth.auth_url }}"
                AUTH_URL="${AUTH_URL%/}"
                TOK_HDR=$(mktemp)
                curl -sS -m 30 -D "$TOK_HDR" -o /dev/null \
                  -X POST "${AUTH_URL}/v3/auth/tokens" \
                  -H 'Content-Type: application/json' \
                  --data "$MINT_BODY"
                export OS_AUTH_TOKEN=$(grep -i '^x-subject-token:' "$TOK_HDR" | tr -d '\r' | awk '{print $2}')
                rm -f "$TOK_HDR"
                if [ -z "$OS_AUTH_TOKEN" ]; then
                  echo "ERROR: failed to mint admin token via curl" >&2
                  exit 1
                fi
                echo "minted admin bootstrap token via curl (len ${#OS_AUTH_TOKEN})" >&2
              fi
              {{- end }}

              # 1. Provision the service user + app-cred (idempotent). Capture the
              #    JSON result (user_id, app_cred_id, app_cred_secret, ...).
              #    (No 2>/dev/null: if this fails we WANT the error in the logs.)
              PROVISION_JSON=$(substation-mcp provision \
                --cloud "$CLOUD" \
                --username "{{ .Values.serviceUser.username }}" \
                --domain "{{ .Values.serviceUser.domain }}" \
                --app-cred-name "{{ .Values.serviceUser.appCredName }}" \
                --roles "{{ range $i, $r := .Values.serviceUser.roles }}{{ if $i }},{{ end }}{{ $r }}{{ end }}" \
                --log-level info)
              echo "provision result:" >&2
              printf '%s\n' "$PROVISION_JSON" >&2

              # 2. Write the app-cred to the identity Secret (create or preserve).
              substation-mcp write-secret \
                --name "$IDENTITY_SECRET" \
                --json "$PROVISION_JSON" \
                --log-level info

              # 3. Register the mcp catalog service + public/internal/admin
              #    endpoints (idempotent).
              substation-mcp register-catalog \
                --cloud "$CLOUD" \
                --region "{{ .Values.serviceUser.region }}" \
                --public-url "{{ .Values.serviceUser.catalog.publicURL }}" \
                --internal-url "{{ .Values.serviceUser.catalog.internalURL }}" \
                --admin-url "{{ .Values.serviceUser.catalog.adminURL }}" \
                --log-level info

              # 4. Mark the clouds Secret as provisioned so the Deployment rolls.
              substation-mcp mark-secret \
                --name "$CLOUDS_SECRET" \
                --key provisioned \
                --value "true" \
                --log-level info
              echo "provisioner complete" >&2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: clouds
          secret:
            secretName: {{ $fullname }}-clouds
            items:
              - key: clouds.yaml
                path: clouds.yaml
        - name: tmp
          emptyDir: {}
{{- end }}
