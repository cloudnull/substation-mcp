# k8s Secret for the OAuth 2.1 AS signing secret. The server reads this as
# `oauth.server_secret` in its config (ConfigLoader flattens to
# `oauth__server_secret`). It is injected as an env var (OSMCP_OAUTH__SERVER_SECRET)
# which has higher precedence than the config file, so the secret never lands
# in a ConfigMap.
#
# The operator MUST set this via:
#   --set oauth.serverSecret=<random-48-bytes-base64>
# or a values override file. Leaving it empty renders nothing (the Secret
# resource is skipped), and the server will refuse to start in release mode.
{{- if .Values.oauth.serverSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "substation-mcp.fullname" . }}-oauth
  namespace: {{ include "substation-mcp.namespace" . }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-secret: {{ .Values.oauth.serverSecret | quote }}
{{- end }}
