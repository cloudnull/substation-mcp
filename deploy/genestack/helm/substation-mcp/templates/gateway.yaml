{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway -}}
{{- $fullname := include "substation-mcp.fullname" . -}}
{{- $ns := include "substation-mcp.namespace" . -}}
---
{{- if $gw.createGateway }}
# Creates the Gateway when the operator has not already provisioned one.
# `gatewayClassName` must match an existing GatewayClass in the cluster
# (Envoy: `envoy-gateway`; Poundcake: `poundcake` — see Genestack docs).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.gatewayName }}
  namespace: {{ $gw.namespace }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.gatewayClassName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "{{ $gw.fqdn }}"
      # TLS cert: the operator must ensure a certificate for $gw.fqdn is
      # available to this listener (cert-manager ClusterIssuer, or a
      # manually-managed secret via `tls.certificateRef`).
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $gw.gatewayName }}-tls   # ← operator must create/point this
            group: ""
    - name: http
      protocol: HTTP
      port: 80
      hostname: "{{ $gw.fqdn }}"
---
{{- end }}
# HTTPRoute: routes traffic for $gw.fqdn to the substation-mcp Service.
#
# SSE / streaming: the substation-mcp server streams Server-Sent Events on
# /v1 and /mcp. Envoy Gateway does NOT buffer HTTP responses by default
# (it is a streaming L7 proxy), so SSE works out of the box. Poundcake
# likewise does not buffer by default. No special annotation is required.
#
# If your Gateway implementation DOES buffer responses (check your
# GatewayClass config), disable buffering for this route — see your
# Gateway's docs for the exact mechanism (e.g. an EnvoyProxy resource with
# `envoy.filters.http.buffer` tuning, or a route-level filter).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-route
  namespace: {{ $ns }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
spec:
  hostnames:
    - "{{ $gw.fqdn }}"
  # Gateway API v1 uses `parentRefs` (NOT `parents` — that field is ignored and
  # leaves the route unattached to any Gateway, so no traffic is routed).
  parentRefs:
    - name: {{ $gw.gatewayName }}
      namespace: {{ $gw.namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
      {{- if $gw.useExistingListener }}
      sectionName: {{ $gw.listenerName }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: {{ $fullname }}
          namespace: {{ $ns }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
