# Renders the substation-mcp server YAML config + the OpenStack clouds.yaml.
#
# Two resources:
#   <fullname>-config  (ConfigMap) → /etc/substation-mcp/config.yaml  (server config, no secrets)
#   <fullname>-clouds  (Secret)    → /etc/openstack/clouds.yaml      (may contain app-cred secret)
#
# The clouds.yaml is a Secret (not ConfigMap) because it may contain the
# application-credential secret. The Deployment mounts both read-only.
# The `checksum/config` pod annotation (in deployment.yaml) hashes the
# config ConfigMap to trigger a rolling restart when the config changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substation-mcp.fullname" . }}-config
  namespace: {{ include "substation-mcp.namespace" . }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
---
# clouds.yaml Secret.
#
# The app-cred fields are populated from .Values.appCred when enabled,
# otherwise they render as empty strings (the server relies on the Bearer
# token each client presents).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "substation-mcp.fullname" . }}-clouds
  namespace: {{ include "substation-mcp.namespace" . }}
  labels:
    {{- include "substation-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      {{- $appCredID := "" }}
      {{- $appCredSecret := "" }}
      {{- if .Values.serviceUser.enabled }}
      {{- /*
            When the provisioner is enabled, the app-cred is created at runtime,
            so we render stable placeholders here. The Deployment's initContainer
            substitutes them from the `<fullname>-service-identity` Secret before
            the server starts (see deployment.yaml). If the operator pre-supplies
            output.id/secret (e.g. importing an existing identity), use those
            directly and skip the initContainer substitution.
      */}}
      {{- if .Values.serviceUser.output.id }}
      {{- $appCredID = .Values.serviceUser.output.id }}
      {{- $appCredSecret = .Values.serviceUser.output.secret }}
      {{- else }}
      {{- $appCredID = "__IDENTITY_APPCRED_ID__" }}
      {{- $appCredSecret = "__IDENTITY_APPCRED_SECRET__" }}
      {{- end }}
      {{- end }}
      {{- range $name, $cloud := .Values.clouds }}
      {{ $name }}:
        auth:
          auth_url: {{ $cloud.auth.auth_url | quote }}
          application_credential_id: {{ $appCredID | quote }}
          application_credential_secret: {{ $appCredSecret | quote }}
        region_name: {{ $cloud.region_name | default "RegionOne" | quote }}
        interface: {{ $cloud.interface | default "public" | quote }}
        verify: {{ $cloud.verify | default true }}
      {{- end }}
