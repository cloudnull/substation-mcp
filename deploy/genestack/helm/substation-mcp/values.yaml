# Default values for the substation-mcp Helm chart (Genestack add-on).
#
# Override via:
#   - base-helm-configs/substation-mcp/substation-mcp-helm-overrides.yaml  (baseline)
#   - /etc/genestack/helm-configs/global_overrides/*.yaml                (global)
#   - /etc/genestack/helm-configs/substation-mcp/*.yaml                   (custom, highest precedence)
#   - helm --set flags in install-substation-mcp.sh
#
# All server-side config that the substation-mcp binary reads from its YAML
# config file lives under `config:` below. The chart renders `config.*`
# into /etc/substation-mcp/config.yaml via the ConfigMap. Env vars
# (OSMCP_*) remain available as a higher-precedence override layer if set
# in `env` below.

# ── Image ──────────────────────────────────────────────────────────────────────
image:
  # Cluster-registry path to the built image (operator builds from deploy/Dockerfile
  # and pushes to their registry before install).
  repository: registry.example.com/openstack/substation-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Optional imagePullSecrets (name of a k8s Secret in the openstack namespace).
imagePullSecrets: []
#  - name: my-registry-cred

# ── Replicas / scheduling ──────────────────────────────────────────────────────
replicas: 1
# resourceSpreadConstraints / topologySpreadConstraints left unset (single-AZ is fine
# for a stateless token-per-request proxy).

# ── Resources ──────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi

# ── Security ───────────────────────────────────────────────────────────────────
# Container runs as uid 10001 (matches deploy/Dockerfile + rootfs tarball).
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# ── Probes ─────────────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# ── Port ───────────────────────────────────────────────────────────────────────
containerPort: 8080
service:
  type: ClusterIP
  port: 8080

# ── Server config (rendered to /etc/substation-mcp/config.yaml) ─────────────────
# IMPORTANT: the key names here MUST match exactly what ConfigLoader.read
# looks up (snake_case, __-separated when flattened). The server's YAML
# flattener preserves key case, so a camelCase key (e.g. `publicUrl`) would
# flatten to `server__publicurl`, which the server does NOT read — it looks
# up `server__public_url`. Use snake_case throughout.
config:
  server:
    host: 0.0.0.0
    port: 8080
    endpoint: /v1
    # MCP endpoint path. /mcp is retained as an alias by the server.
    public_url: https://substation-mcp.example.com
    allowed_origins:
      - "*"
    max_body_bytes: 1048576
    metrics_token: ""   # set to gate /metrics with a bearer token
  auth:
    profile: keystone_token
    # keystone_url is derived from the Keystone catalog at runtime (empty = use catalog).
    keystone_url: ""
    token_cache_ttl: 60
    failed_auth_per_minute: 10
    login_page_enabled: true
  clouds:
    # Name of the default cloud in clouds.yaml (see cloudsClouds below).
    default: mycloud
    # Names a session may select (empty = all).
    allowed: []
    # Path to clouds.yaml (mounted).
    file: /etc/openstack/clouds.yaml
  session:
    idle_ttl: 1800
    max_lifetime: 43200
    max_sessions: 500
  policy:
    read_only: false
    deny_resources:
      - project
      - user
      - group
      - role
      - role_assignment
      - domain
    max_list_limit: 200
    max_calls_per_minute: 120
  client:
    request_timeout: 60
    max_connections_per_host: 0
  log:
    level: info
    format: json
    audit: true

# ── clouds.yaml (rendered into a SECRET at /etc/openstack/clouds.yaml) ─────────
# Each key directly under `clouds:` is a cloud name. The value is a flat map
# the server's CloudConfig.makeEntry reads (snake_case keys, NOT camelCase):
#   - region_name / region   → CloudEntry.regionName
#   - interface              → CloudEntry.interface (default "public")
#   - cacert                 → CloudEntry.cacert
#   - verify                 → CloudEntry.verify (default true)
#   - auth.auth_url          → CloudEntry.authURL
#   - auth.application_credential_id       → CloudEntry.appCredID
#   - auth.application_credential_secret   → CloudEntry.appCredSecret
#
# NOTE: this is the OpenStack clouds.yaml format
# (https://docs.openstack.org/cli-reference/project/clouds-yaml.html).
# It is NOT the `config.clouds` section above (which tells the binary which
# cloud to use by default — set `config.clouds.default` to one of these keys).
#
# The clouds.yaml is rendered into a Secret (not a ConfigMap) because it may
# contain the application-credential secret. The Deployment mounts it
# read-only at /etc/openstack/clouds.yaml.
clouds:
  mycloud:
    auth:
      auth_url: "https://keystone.example.com/v3"
      # Application credential (for the /v1/login URL-mode page + token
      # minting). When appCred.enabled is true, the chart fills these from
      # appCred.id / appCred.secret. Otherwise they stay empty and the
      # server relies on the Bearer token each MCP client presents (which
      # the server validates per-request; no server-side app-cred needed
      # for read-only operations).
      application_credential_id: ""
      application_credential_secret: ""
    region_name: "RegionOne"
    interface: public
    verify: true

# ── Application credential (optional; powers /v1/login URL-mode page) ─────────
# When enabled, the chart renders `application_credential_id` +
# `application_credential_secret` from these values into the clouds.yaml
# Secret. If the login page is disabled (config.auth.loginPageEnabled: false)
# and clients present their own Bearer tokens, leave `enabled: false` — the
# clouds.yaml app-cred fields stay empty.
appCred:
  enabled: false
  id: ""
  secret: ""

# ── Extra env vars (OSMCP_* form, higher precedence than the config file) ─────
env: []
#  - name: OSMCP_LOG__LEVEL
#    value: "debug"

# ── Gateway API (optional external exposure) ───────────────────────────────────
# When enabled, the chart renders an HTTPRoute (and, if `createGateway` is true,
# a Gateway) that routes traffic for `fqdn` to the substation-mcp Service.
# TLS terminates at the Gateway. The operator must ensure the Gateway listener
# has a certificate for `fqdn` (cert-manager or manual).
#
# SSE / streaming: the server streams Server-Sent Events on /v1 and /mcp.
# Envoy Gateway and Poundcake do NOT buffer HTTP responses by default, so
# SSE works out of the box — no special annotation is required. If your
# Gateway implementation DOES buffer, see your Gateway's docs for the exact
# mechanism (e.g. an EnvoyProxy resource with buffer tuning). See
# templates/gateway.yaml + deploy/genestack/README.md.
gateway:
  enabled: false
  createGateway: false        # true if the operator has NOT already created a Gateway
  fqdn: substation-mcp.example.com
  namespace: openstack         # namespace of the Gateway (cross-ns routing supported)
  gatewayName: substation-mcp-gateway
  # Match your cluster's GatewayClass. Envoy Gateway: `envoy-gateway`.
  # Poundcake (Rackspace): `poundcake`. Check with `kubectl get gatewayclass`.
  gatewayClassName: envoy-gateway
  listenerName: substation-mcp
  # If the operator's existing Gateway already has a listener for the wildcard
  # domain (e.g. *.example.com), set `useExistingListener: true` and the chart
  # will NOT create a new listener — it will only create the HTTPRoute.
  useExistingListener: false

# ── Labels / annotations ───────────────────────────────────────────────────────
labels: {}
annotations: {}
podLabels: {}
podAnnotations: {}

# ── ServiceAccount ─────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: substation-mcp
  annotations: {}

# ── Node selector / tolerations / affinity ─────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
