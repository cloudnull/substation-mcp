# Default values for the substation-mcp Helm chart (Genestack add-on).
#
# Override via:
#   - base-helm-configs/substation-mcp/substation-mcp-helm-overrides.yaml  (baseline)
#   - /etc/genestack/helm-configs/global_overrides/*.yaml                (global)
#   - /etc/genestack/helm-configs/substation-mcp/*.yaml                   (custom, highest precedence)
#   - helm --set flags in install-substation-mcp.sh
#
# All server-side config that the substation-mcp binary reads from its YAML
# config file lives under `config:` below. The chart renders `config.*`
# into /etc/substation-mcp/config.yaml via the ConfigMap. Env vars
# (OSMCP_*) remain available as a higher-precedence override layer if set
# in `env` below.

# ── Image ──────────────────────────────────────────────────────────────────────
image:
  # Cluster-registry path to the built image (operator builds from deploy/Dockerfile
  # and pushes to their registry before install).
  repository: registry.example.com/openstack/substation-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Optional imagePullSecrets (name of a k8s Secret in the openstack namespace).
imagePullSecrets: []
#  - name: my-registry-cred

# ── Replicas / scheduling ──────────────────────────────────────────────────────
replicas: 1
# resourceSpreadConstraints / topologySpreadConstraints left unset (single-AZ is fine
# for a stateless token-per-request proxy).

# ── Resources ──────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi

# ── Security ───────────────────────────────────────────────────────────────────
# Container runs as uid 10001 (matches deploy/Dockerfile + rootfs tarball).
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# ── Probes ─────────────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# ── Port ───────────────────────────────────────────────────────────────────────
containerPort: 8080
service:
  type: ClusterIP
  port: 8080

# ── Server config (rendered to /etc/substation-mcp/config.yaml) ─────────────────
# IMPORTANT: the key names here MUST match exactly what ConfigLoader.read
# looks up (snake_case, __-separated when flattened). The server's YAML
# flattener preserves key case, so a camelCase key (e.g. `publicUrl`) would
# flatten to `server__publicurl`, which the server does NOT read — it looks
# up `server__public_url`. Use snake_case throughout.
config:
  server:
    host: 0.0.0.0
    port: 8080
    endpoint: /v1
    # MCP endpoint path. /mcp is retained as an alias by the server.
    public_url: https://substation-mcp.example.com
    allowed_origins:
      - "*"
    max_body_bytes: 1048576
    metrics_token: ""   # set to gate /metrics with a bearer token
  auth:
    profile: keystone_token
    # keystone_url is derived from the Keystone catalog at runtime (empty = use catalog).
    keystone_url: ""
    token_cache_ttl: 60
    failed_auth_per_minute: 10
    login_page_enabled: true
  clouds:
    # Name of the default cloud in clouds.yaml (see cloudsClouds below).
    default: mycloud
    # Names a session may select (empty = all).
    allowed: []
    # Path to clouds.yaml (mounted).
    file: /etc/openstack/clouds.yaml
  session:
    idle_ttl: 1800
    max_lifetime: 43200
    max_sessions: 500
  policy:
    read_only: false
    deny_resources:
      - project
      - user
      - group
      - role
      - role_assignment
      - domain
    max_list_limit: 200
    max_calls_per_minute: 120
  client:
    request_timeout: 60
    # AsyncHTTPClient's concurrent HTTP/1.1 connections-per-host soft limit.
    # MUST be >= 1: a value of 0 makes the client open zero connections to the
    # host, so every request waits forever and times out (no SYN on the wire).
    max_connections_per_host: 16
  log:
    level: info
    format: json
    audit: true

# ── clouds.yaml (rendered into a SECRET at /etc/openstack/clouds.yaml) ─────────
# Each key directly under `clouds:` is a cloud name. The value is a flat map
# the server's CloudConfig.makeEntry reads (snake_case keys, NOT camelCase):
#   - region_name / region   → CloudEntry.regionName
#   - interface              → CloudEntry.interface (default "public")
#   - cacert                 → CloudEntry.cacert
#   - verify                 → CloudEntry.verify (default true)
#   - auth.auth_url          → CloudEntry.authURL
#   - auth.application_credential_id       → CloudEntry.appCredID
#   - auth.application_credential_secret   → CloudEntry.appCredSecret
#
# NOTE: this is the OpenStack clouds.yaml format
# (https://docs.openstack.org/cli-reference/project/clouds-yaml.html).
# It is NOT the `config.clouds` section above (which tells the binary which
# cloud to use by default — set `config.clouds.default` to one of these keys).
#
# The clouds.yaml is rendered into a Secret (not a ConfigMap) because it may
# contain the application-credential secret. The Deployment mounts it
# read-only at /etc/openstack/clouds.yaml.
clouds:
  mycloud:
    auth:
      auth_url: "https://keystone.example.com/v3"
      # Application credential (for the /v1/login URL-mode page + token
      # minting). When appCred.enabled is true, the chart fills these from
      # appCred.id / appCred.secret. Otherwise they stay empty and the
      # server relies on the Bearer token each MCP client presents (which
      # the server validates per-request; no server-side app-cred needed
      # for read-only operations).
      application_credential_id: ""
      application_credential_secret: ""
    region_name: "RegionOne"
    interface: public
    verify: true

# ── Service user + application credential (REQUIRED deployment step) ──────────
#
# The deployment's standing identity: a service user in the OpenStack `service`
# domain (mirroring `nova_service_user`) with the admin role and an application
# credential. This credential powers catalog registration, the /v1/login
# URL-mode page, and (optionally) conformance — it is reusable and never
# expires, unlike a one-shot token.
#
# Provisioning is done automatically by a Helm post-install/post-upgrade Job
# (templates/provisioner.yaml) which runs `substation-mcp provision` +
# `register-catalog` against the cloud, then writes the app-cred to the
# `<fullname>-service-identity` k8s Secret and marks `<fullname>-clouds`
# complete (rolling the Deployment). It is IDEMPOTENT: on re-run it reuses the
# existing user/app-cred (no duplicates) and no longer knows the secret, so it
# preserves the value already in the identity Secret.
#
# You MUST supply the operator's admin credential (used only by the provisioner
# to mint a short-lived admin token, never stored) via ONE of:
#   auth.appCred:   application_credential_id + application_credential_secret
#   auth.password:  username + password + domain (default "admin")
#
# The PROVISIONED app-cred's output is written to a k8s Secret — you do NOT
# type it in. It is then injected into the clouds.yaml Secret for the server.
serviceUser:
  enabled: false          # flip to true to auto-provision (required for Genestack)
  username: substation    # service-domain username to create/reuse
  domain: service         # OpenStack domain (default "service")
  appCredName: substation-cred   # name of the application credential
  roles: [admin]          # roles to grant on the domain (comma list or array)
  # The cloud (from clouds.yaml) the provisioner + catalog registration target.
  # Matches `config.clouds.default`.
  cloud: sat0
  # The region the mcp catalog endpoints are registered in.
  region: SAT0
  # Identity endpoint the provisioner uses for its operations (mints +
  # identity/catalog calls). Defaults to empty = the cloud's auth_url. On
  # Genestack/RDO set this to the PUBLIC Keystone endpoint (e.g.
  # https://keystone.api.sat0.cloudnull.dev/v3): the in-cluster keystone svc
  # rejects scoped password mints (spurious 400 "invalid JSON") and may lack
  # the full cross-domain admin API, while the public endpoint is pod-reachable,
  # accepts scoped mints, and has the full API. The running server keeps the
  # cloud's auth_url for token validation (unaffected).
  authURL: ""
  # ── Catalog endpoints (public/internal/admin URLs — user-definable) ─────────
  # All three default to the same public URL; split them if your cloud exposes
  # different endpoints per interface.
  catalog:
    publicURL: "https://substation-mcp.example.com"
    internalURL: "https://substation-mcp.example.com"
    adminURL: "https://substation-mcp.example.com"
  # ── Operator admin credential (input, for the provisioner only) ─────────────
  auth:
    # Option A: application credential
    appCred:
      id: ""
      secret: ""
    # Option B: user password
    password:
      username: ""
      password: ""
      # Domain the admin user lives in (for the auth identity block).
      domain: "default"
      # Project to scope the admin token to (for the auth scope block). A
      # project-scoped token to the cloud's admin project is the full-privilege
      # credential that can see/manage ALL domains (service, heat, default) and
      # create users + app-creds + role grants. On Genestack/RDO this is the
      # "admin" project. Leave empty for a domain-scoped token (limited to one
      # domain — insufficient for cross-domain provisioning).
      project: "admin"
  # ── Output (do not edit — written by the provisioner Job) ───────────────────
  # Rendered into the clouds.yaml Secret's app-cred fields (see configmap.yaml).
  # `secret` is populated from the identity Secret at render time.
  output:
    id: ""
    secret: ""

# ── Extra env vars (OSMCP_* form, higher precedence than the config file) ─────
env: []
#  - name: OSMCP_LOG__LEVEL
#    value: "debug"

# ── Gateway API (optional external exposure) ───────────────────────────────────
# When enabled, the chart renders an HTTPRoute (and, if `createGateway` is true,
# a Gateway) that routes traffic for `fqdn` to the substation-mcp Service.
# TLS terminates at the Gateway. The operator must ensure the Gateway listener
# has a certificate for `fqdn` (cert-manager or manual).
#
# SSE / streaming: the server streams Server-Sent Events on /v1 and /mcp.
# Envoy Gateway and Poundcake do NOT buffer HTTP responses by default, so
# SSE works out of the box — no special annotation is required. If your
# Gateway implementation DOES buffer, see your Gateway's docs for the exact
# mechanism (e.g. an EnvoyProxy resource with buffer tuning). See
# templates/gateway.yaml + deploy/genestack/README.md.
gateway:
  enabled: false
  createGateway: false        # true if the operator has NOT already created a Gateway
  fqdn: substation-mcp.example.com
  namespace: openstack         # namespace of the Gateway (cross-ns routing supported)
  gatewayName: substation-mcp-gateway
  # Match your cluster's GatewayClass. Envoy Gateway: `envoy-gateway`.
  # Poundcake (Rackspace): `poundcake`. Check with `kubectl get gatewayclass`.
  gatewayClassName: envoy-gateway
  listenerName: substation-mcp
  # If the operator's existing Gateway already has a listener for the wildcard
  # domain (e.g. *.example.com), set `useExistingListener: true` and the chart
  # will NOT create a new listener — it will only create the HTTPRoute.
  useExistingListener: false

# ── Labels / annotations ───────────────────────────────────────────────────────
labels: {}
annotations: {}
podLabels: {}
podAnnotations: {}

# ── ServiceAccount ─────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: substation-mcp
  annotations: {}

# ── Node selector / tolerations / affinity ─────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
