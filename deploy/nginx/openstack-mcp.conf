# nginx reverse proxy config for OpenStack MCP (spec §13).
#
# TLS terminates here. The MCP server runs on 127.0.0.1:8080.
#
# Critical for MCP over HTTP: proxy_buffering must be OFF for SSE streams
# on /v1 and /mcp, or the client will not see streaming events.
#
# Include this in your nginx server block:
#   include /etc/nginx/conf.d/openstack-mcp.conf;
#
# Or add the location blocks directly to your existing server block.

upstream openstack_mcp {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- MCP streaming paths (SSE) — buffering disabled ---
location /v1/ {
    proxy_pass http://openstack_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Disable buffering for SSE streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;   # long-lived SSE connections
    proxy_send_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Legacy /mcp alias
location /mcp/ {
    proxy_pass http://openstack_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- All other paths: normal proxying ---
location / {
    proxy_pass http://openstack_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
